[package]
name = "subview"
version = "0.2.0"
edition = "2024"
description = "把标准输入的字幕流实时显示到屏幕"
license = "MIT"
repository = "https://github.com/someoneonsmile/subview"

[features]
default = ["overlay"]
overlay = ["dep:cosmic-text", "dep:x11rb"]

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cosmic-text = { version = "0.19.0", optional = true }
crossterm = "0.29.0"
libc = "0.2.191"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
x11rb = { version = "0.14.0", features = ["shape"], optional = true }

[build-dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
